title = "Local Inference Stack gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Deployment manifest named SHA-256 identities"
condition = "AND"
regexTarget = "match"
paths = ['''^deployments/[^/]+/manifest\.json$''']
regexes = ['''[A-Za-z][A-Za-z0-9]*Sha256"\s*:\s*"[0-9a-f]{64}"''']
